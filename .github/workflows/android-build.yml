name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Write Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lowguard-android-build
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: lowguard-android-build
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LowGuard v1.0.0
          generate_release_notes: false
          body: |
            # LowGuard v1.0.0 — نگهبان قند

            Android release built by GitHub Actions.

            Includes:
            - Debug APK
            - Release APK
            - Release AAB

            Medical disclaimer:
            This app is a local-first support tool for logging glucose and related events, estimating personal risk windows, and reminders. It is not a diagnostic or treatment system.

            Notifications:
            Android 13+ requests the system notification permission. Users can manage notification access from the app settings screen.

            Release signing:
            The initial CI APK is debug-signed for installation/testing. A production-store release requires a private release keystore.
          files: |
            dist/app-release.apk
            dist/app-debug.apk
            dist/app-release.aab
