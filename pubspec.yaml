name: lowguard
description: "LowGuard (نگهبان قند) - local-first Android companion for glucose logging, personal risk estimation, and safety reminders."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
